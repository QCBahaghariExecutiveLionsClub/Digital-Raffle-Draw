<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Official Raffle Results</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#D4A017; --gold-light:#F5C842;
  --deep:#1A0A2E; --deep2:#2D1B5E;
  --accent:#E85D04; --cream:#FFF8EE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Nunito',sans-serif;
  background:radial-gradient(ellipse at 20% 10%,rgba(212,160,23,.14) 0%,transparent 45%),
             radial-gradient(ellipse at 80% 90%,rgba(232,93,4,.12) 0%,transparent 45%),
             var(--deep);
  color:var(--cream);min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;padding:28px 14px 40px;
}

.header{text-align:center;max-width:800px;margin-bottom:6px;}
.badge{
  display:inline-block;font-family:'Playfair Display',serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--gold),var(--accent));color:#fff;padding:9px 24px;border-radius:100px;
  margin-bottom:14px;box-shadow:0 6px 22px rgba(212,160,23,.4);
}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);color:var(--gold-light);margin-bottom:8px;}
.subtitle{font-size:1.05rem;color:rgba(255,248,238,.75);line-height:1.5;max-width:600px;margin:0 auto 10px;}

/* ============================================================
   CAROUSEL
   ============================================================ */
.carousel-wrap{
  width:100%;max-width:640px;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:18px;touch-action:pan-y;
}
.nav-arrow{
  flex-shrink:0;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--accent));border:none;color:#fff;
  font-size:1.8rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 26px rgba(212,160,23,.45);transition:transform .15s;
}
.nav-arrow:active{transform:scale(.92);}
.nav-arrow:hover{transform:translateY(-1px);}

.card-viewport{
  position:relative;flex:1;min-width:0;min-height:420px;
  display:flex;align-items:center;justify-content:center;
}
.card{
  position:relative;overflow:hidden;width:100%;max-width:480px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1.5px solid rgba(212,160,23,.4);border-radius:26px;
  padding:38px 30px 34px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 0 1px rgba(212,160,23,.12) inset;
}
.card::after{
  content:'';position:absolute;top:0;left:-150%;width:55%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);animation:shimmerSweep 2.8s ease-in-out infinite;pointer-events:none;
}
@keyframes shimmerSweep{0%{left:-150%;}55%{left:150%;}100%{left:150%;}}

.card-trophy{font-size:3rem;margin-bottom:6px;}
.card-round{font-size:1.05rem;color:var(--gold-light);font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
.card-prize{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.4rem,3.4vw,1.9rem);color:var(--cream);margin:8px 0 18px;line-height:1.3;}
.card-name{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:900;color:#fff;text-shadow:0 0 22px rgba(212,160,23,.5);}
.card-ticket{font-family:'Courier New',monospace;font-size:1.05rem;color:rgba(255,248,238,.6);margin-top:10px;letter-spacing:2px;}

@keyframes enterRight{from{opacity:0;transform:translateX(70px) scale(.94);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes enterLeft{from{opacity:0;transform:translateX(-70px) scale(.94);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes enterFade{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
.enter-right{animation:enterRight .45s cubic-bezier(.22,.85,.3,1);}
.enter-left{animation:enterLeft .45s cubic-bezier(.22,.85,.3,1);}
.enter-fade{animation:enterFade .5s ease;}

.counter{margin-top:20px;font-size:1.1rem;font-weight:700;color:rgba(255,248,238,.7);}
.swipe-hint{margin-top:6px;font-size:.85rem;color:rgba(255,248,238,.4);}

.state-msg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:50px 20px;color:rgba(255,248,238,.55);font-size:1.15rem;
  max-width:480px;margin:0 auto;width:100%;
}
.state-msg .emoji{font-size:2.6rem;margin-bottom:14px;line-height:1;}
.spin{width:38px;height:38px;border:4px solid rgba(212,160,23,.25);border-top-color:var(--gold);border-radius:50%;
  margin:0 auto 16px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:50;}

footer{margin-top:34px;font-size:.85rem;color:rgba(255,248,238,.4);text-align:center;}

@media(max-width:480px){
  .nav-arrow{width:46px;height:46px;font-size:1.5rem;}
  .card-viewport{min-height:380px;}
  .card{padding:30px 20px 26px;}
}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="header">
  <div class="badge">🎰 Roaring Raffle 2026</div>
  <h1>Official Raffle Results</h1>
  <p class="subtitle">Congratulations to all our winners! Swipe or tap the arrows to see everyone who won.</p>
</div>

<div class="carousel-wrap" id="carouselWrap">
  <button class="nav-arrow" id="prevBtn" onclick="goPrev()" aria-label="Previous winner">‹</button>
  <div class="card-viewport" id="cardViewport">
    <div class="state-msg"><div class="spin"></div>Loading results…</div>
  </div>
  <button class="nav-arrow" id="nextBtn" onclick="goNext()" aria-label="Next winner">›</button>
</div>

<div class="counter" id="counter"></div>
<div class="swipe-hint" id="swipeHint" hidden>👉 Swipe left or right, or use the arrows</div>

<footer id="footerNote"></footer>

<script>
// ============================================================
// CONFIG
// ============================================================
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzhGiWymJBv_soDxGxNlSPLRiuYQRGUea4cIjYRX_6jNqG9UO3u2TB7U5e34vDICNJNfg/exec';

// How much of the ticket number to show. Change this one word any time:
//   'full'   -> show the whole ticket ID
//   'last4'  -> show only the last 4 characters, e.g. "••••3F2A"
//   'hidden' -> don't show the ticket number at all
const TICKET_DISPLAY = 'full';

let allWinners = [];
let currentIndex = 0;

function formatTicket(ticket){
  if(TICKET_DISPLAY === 'hidden') return '';
  if(TICKET_DISPLAY === 'last4'){
    const t = String(ticket || '');
    return t.length > 4 ? '••••' + t.slice(-4) : t;
  }
  return ticket || '';
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadWinners(){
  try {
    const resp = await fetch(WEBAPP_URL + '?action=getWinners', { mode: 'cors' });
    const data = await resp.json();
    if(!data.success) throw new Error(data.message || 'Unknown error');
    allWinners = data.winners || [];
    currentIndex = 0;
    if(allWinners.length === 0){
      showMessage('🎟', 'No winners have been posted yet. Please check back soon.');
    } else {
      renderCard(null);
      document.getElementById('swipeHint').hidden = allWinners.length < 2;
    }
    document.getElementById('footerNote').textContent =
      '';
  } catch(e){
    showMessage('⚠️', 'Could not load results right now. Please check your internet connection and reload the page.');
  }
}

function showMessage(emoji, text){
  document.getElementById('cardViewport').innerHTML =
    `<div class="state-msg"><span class="emoji">${emoji}</span>${escapeHtml(text)}</div>`;
  document.getElementById('counter').textContent = '';
}

function renderCard(direction){
  const w = allWinners[currentIndex];
  const ticketLine = formatTicket(w.ticketId);
  const enterClass = direction === 'next' ? 'enter-right' : direction === 'prev' ? 'enter-left' : 'enter-fade';

  document.getElementById('cardViewport').innerHTML = `
    <div class="card ${enterClass}">
      <div class="card-trophy">🏆</div>
      <div class="card-round">${escapeHtml(w.round || '')}</div>
      <div class="card-prize">${escapeHtml(w.prize || 'Prize')}</div>
      <div class="card-name">${escapeHtml(w.name || '')}</div>
      ${ticketLine ? `<div class="card-ticket">${escapeHtml(ticketLine)}</div>` : ''}
    </div>`;

  document.getElementById('counter').textContent =
    'Winner ' + (currentIndex + 1) + ' of ' + allWinners.length;

  burstConfetti();
}

function goNext(){
  if(allWinners.length === 0) return;
  currentIndex = (currentIndex + 1) % allWinners.length; // wraps around — no dead-end buttons
  renderCard('next');
}
function goPrev(){
  if(allWinners.length === 0) return;
  currentIndex = (currentIndex - 1 + allWinners.length) % allWinners.length;
  renderCard('prev');
}

// ====== SWIPE (touch) ======
let touchStartX = null, touchStartY = null;
const wrap = document.getElementById('carouselWrap');
wrap.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, { passive: true });
wrap.addEventListener('touchend', e => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? goNext() : goPrev(); }
  touchStartX = null; touchStartY = null;
});
// ====== Keyboard arrows (desktop bonus, doesn't hurt anything) ======
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

// ============================================================
// SUBTLE CONFETTI BURST (short, light — not the full event-draw version)
// ============================================================
const canvas = document.getElementById('confettiCanvas');
const cctx = canvas.getContext('2d');
const BALL_COLORS = ['#F5C842','#D4A017','#E85D04','#fff','#2A9D5C'];
let confettiPieces = [], confettiRunning = false, confettiFrame;

function burstConfetti(){
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const originX = window.innerWidth / 2, originY = window.innerHeight * 0.35;
  confettiPieces = [];
  for(let i=0;i<70;i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    confettiPieces.push({
      x: originX, y: originY,
      w: Math.random()*8+4, h: Math.random()*5+3,
      color: BALL_COLORS[Math.floor(Math.random()*BALL_COLORS.length)],
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
      rot: Math.random()*360, vrot: (Math.random()-0.5)*10,
      life: 0,
    });
  }
  if(!confettiRunning){ confettiRunning = true; drawConfetti(); }
}
function drawConfetti(){
  cctx.clearRect(0,0,canvas.width,canvas.height);
  let alive = false;
  confettiPieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.rot += p.vrot; p.life++;
    if(p.life > 110) return;
    alive = true;
    cctx.save(); cctx.globalAlpha = Math.max(0, 1 - p.life/110);
    cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle = p.color; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore();
  });
  if(alive){ confettiFrame = requestAnimationFrame(drawConfetti); }
  else { confettiRunning = false; cctx.clearRect(0,0,canvas.width,canvas.height); }
}

loadWinners();
</script>
</body>
</html>
